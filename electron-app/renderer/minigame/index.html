<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTIENT — Mini Game</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="minigame-hud">
    <div class="hud-item">
      <span class="hud-label">KALAN SÜRE:</span>
      <span id="timer-val" class="hud-val danger">60s</span>
    </div>
    <div class="hud-progress-container">
      <div id="defense-bar" class="hud-progress-bar"></div>
    </div>
    <div class="hud-item">
      <span class="hud-label">KAPATILAN:</span>
      <span id="score-val" class="hud-val">0</span>
    </div>
  </div>

  <!-- Dynamic error dialog spawn container -->
  <div id="game-field" class="game-arena"></div>

  <!-- End Game Overlay -->
  <div id="game-over-modal" class="game-modal" style="display: none;">
    <div class="modal-content">
      <h1 id="modal-title" class="modal-title">SİSTEM KORUNDU</h1>
      <p id="modal-desc" class="modal-desc">Tüm tehditler engellendi.</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
