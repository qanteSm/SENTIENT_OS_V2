<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTIENT_OS — KERNEL OVERRIDE ARENA</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <div class="crt-scanlines"></div>
  <div class="crt-vignette"></div>

  <!-- HUD Top Bar -->
  <div class="game-hud" id="game-hud">
    <div class="hud-group">
      <span class="hud-tag">SİSTEM DURUMU:</span>
      <span id="hud-system-status" class="hud-val normal">FAZ 1: KERNEL PROBE</span>
    </div>

    <!-- Boss HP Bar & Phase Tracker -->
    <div class="boss-hp-wrapper" id="boss-hp-section">
      <div class="boss-label-bar">
        <span class="boss-name" id="boss-title">SENTIENT // CORRUPTED CORE</span>
        <span class="boss-hp-text" id="boss-hp-text">100%</span>
      </div>
      <div class="boss-hp-track">
        <div class="boss-hp-fill" id="boss-hp-bar"></div>
      </div>
    </div>

    <!-- Player Stats & Countdown Timer -->
    <div class="hud-group hud-right">
      <div class="player-stat">
        <span class="hud-tag">CAN:</span>
        <div class="hearts-container" id="player-hearts">❤❤❤</div>
      </div>
      <div class="player-stat">
        <span class="hud-tag">ENERJİ:</span>
        <div class="energy-track">
          <div class="energy-fill" id="player-energy-bar"></div>
        </div>
      </div>
      <div class="hud-timer">
        <span id="timer-val">90s</span>
      </div>
    </div>
  </div>

  <!-- Main Canvas for 2D Boss Platformer Engine -->
  <div class="canvas-container">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
  </div>

  <!-- Controls Helper Guide (Overlay) -->
  <div class="controls-guide" id="controls-guide">
    <span>[A / D / ← →]: HAREKET</span>
    <span>[W / ↑ / BOŞLUK]: ÇİFT ZIPLAMA</span>
    <span>[SHIFT / C]: DASH ATILMA</span>
    <span>[E / J / SOL TIK]: EMP DARBESİ</span>
  </div>

  <!-- End Game Modal -->
  <div id="game-over-modal" class="game-modal" style="display: none;">
    <div class="modal-card">
      <h1 id="modal-title" class="modal-title">SİSTEM KORUNDU</h1>
      <p id="modal-desc" class="modal-desc">SENTIENT Çekirdeği temizlendi.</p>
      <div class="modal-stats" id="modal-stats"></div>
      <div class="modal-actions">
        <button id="modal-continue-btn" class="modal-btn">DEVAM ET</button>
      </div>
    </div>
  </div>

  <!-- Modular Scripts -->
  <script src="audio/synth.js"></script>
  <script src="entities/particles.js"></script>
  <script src="entities/player.js"></script>
  <script src="entities/boss.js"></script>
  <script src="entities/platforms.js"></script>
  <script src="ui/hud.js"></script>
  <script src="engine.js"></script>
</body>
</html>
