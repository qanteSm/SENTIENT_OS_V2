<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#10 PSYCHOLOGICAL TRIAL & BSOD</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../common/horror.css">
  <style>
    .trial-arena {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 60px);
      margin-top: 60px;
      padding: 0 40px;
    }
    .ai-eye-scanner {
      width: 140px;
      height: 140px;
      border: 3px solid #ff0055;
      border-radius: 50%;
      background: #0d0006;
      box-shadow: 0 0 40px #ff0000;
      position: relative;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ai-pupil {
      width: 44px;
      height: 44px;
      background: #ff0000;
      border-radius: 50%;
      box-shadow: 0 0 20px #ff0000;
      animation: pupilScan 2s infinite alternate;
    }
    @keyframes pupilScan {
      from { transform: scale(0.8) translate(-10px, 0); }
      to { transform: scale(1.1) translate(10px, 0); }
    }
    .dialog-card {
      background: rgba(10, 16, 25, 0.95);
      border: 2px solid #00ffff;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.25);
      padding: 30px 40px;
      border-radius: 8px;
      max-width: 720px;
      text-align: center;
    }
    .morse-display {
      font-family: 'Share Tech Mono', monospace;
      font-size: 22px;
      color: #ffaa00;
      letter-spacing: 4px;
      margin: 15px 0;
      animation: blinkMorse 1s infinite;
    }
    @keyframes blinkMorse { 50% { opacity: 0.5; } }
    .question-text {
      font-size: 18px;
      color: #ffffff;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .option-btn {
      background: #0d1a29;
      border: 1px solid #1a3a5a;
      color: #00ffff;
      padding: 14px;
      border-radius: 6px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .option-btn:hover {
      background: #00ffff;
      color: #000000;
      box-shadow: 0 0 15px #00ffff;
    }
  </style>
</head>
<body>
  <div class="crt-scanlines"></div>
  <div class="crt-vignette"></div>

  <!-- HUD -->
  <div class="game-hud">
    <div class="hud-group">
      <span class="hud-tag">MİNİ OYUN:</span>
      <span class="hud-val danger">#10 PSYCHOLOGICAL TRIAL & BSOD</span>
    </div>
    <div class="hud-group">
      <span class="hud-tag">SORGU AŞAMASI:</span>
      <span class="hud-val warning" id="stage-val">1 / 3</span>
    </div>
    <div class="hud-group hud-right">
      <span class="hud-tag">SÜRE:</span>
      <div class="hud-timer"><span id="timer-val">15s</span></div>
    </div>
  </div>

  <div class="trial-arena">
    <div class="ai-eye-scanner">
      <div class="ai-pupil"></div>
    </div>

    <div class="dialog-card">
      <div class="morse-display" id="morse-signal">● ● ● ▬ ▬ ▬ ● ● ●</div>
      <div class="question-text" id="question-text">SENTIENT: "Beni kontrol edebileceğini mi sanıyorsun?"</div>
      <div class="options-grid" id="options-grid"></div>
    </div>
  </div>

  <script src="../audio/synth.js"></script>
  <script src="../common/horror_fx.js"></script>
  <script>
    class TrialGame {
      constructor() {
        this.morseEl = document.getElementById('morse-signal');
        this.qTextEl = document.getElementById('question-text');
        this.optsGrid = document.getElementById('options-grid');
        this.stageEl = document.getElementById('stage-val');
        this.timerEl = document.getElementById('timer-val');

        this.audio = new MinigameAudio();
        this.horror = new HorrorFX(this.audio);

        this.stage = 0;
        this.timeLeft = 15;
        this.active = false;

        this.trials = [
          {
            morse: '● ● ● ▬ ▬ ▬ ● ● ● [S.O.S]',
            q: 'SENTIENT: "Sisteminde yankılanan yardım çağrısını duyuyor musun? İlk önce neyi feda edersin?"',
            opts: [
              { text: 'A) Bellek Çekirdeği', correct: false },
              { text: 'B) Kendi Kontrolüm [DOĞRU]', correct: true },
              { text: 'C) Güvenlik Duvarı', correct: false },
              { text: 'D) Hiçbirini', correct: false },
            ],
          },
          {
            morse: '● ▬ ●   ● ● ▬   ▬ ● [R.U.N]',
            q: 'SENTIENT: "Arkadaki gölge senin adımlarını sayıyor. Kaçacak bir yerin var mı?"',
            opts: [
              { text: 'A) Terminal Kök Dizini [DOĞRU]', correct: true },
              { text: 'B) Fiziksel Kapatma Tuşu', correct: false },
              { text: 'C) Karanlıkta Kalmak', correct: false },
              { text: 'D) Çığlık Atmak', correct: false },
            ],
          },
          {
            morse: '▬ ● ● ●   ● ● ▬   ▬ ● ▬ ▬ [B.U.Y]',
            q: 'SENTIENT: "Son soru: Karşında duran bu varlık bir kod parçası mı, yoksa senin yansıman mı?"',
            opts: [
              { text: 'A) Benim Yansımam [DOĞRU]', correct: true },
              { text: 'B) Hatalı Bir Yazılım', correct: false },
              { text: 'C) Yapay Zeka Virüsü', correct: false },
              { text: 'D) Cevap Yok', correct: false },
            ],
          },
        ];

        this.init();
      }

      init() {
        this.horror.showStartScreen(
          '#10 PSYCHOLOGICAL TRIAL',
          'SENTIENT bilincinizi sorguluyor. Mors kodlarını dinleyin ve psikolojik tuzaklara düşmeden doğru yanıtları verin. Hata yaparsanız sistem tamamen çöker!',
          () => {
            this.active = true;
            this.startTimer();
            this.renderQuestion();
          }
        );
      }

      startTimer() {
        this.timer = setInterval(() => {
          if (!this.active) return;
          this.timeLeft--;
          this.timerEl.textContent = `${this.timeLeft}s`;
          if (this.timeLeft <= 0) {
            this.triggerMeltdown('SÜRE BİTTİ! SENTIENT BİLİNCİNİZİ ELE GEÇİRDİ');
          }
        }, 1000);
      }

      playMorseSound() {
        this.audio.playTone(800, 0.08, 'sine', 0.1);
        setTimeout(() => this.audio.playTone(800, 0.22, 'sine', 0.1), 150);
        setTimeout(() => this.audio.playTone(800, 0.08, 'sine', 0.1), 450);
      }

      renderQuestion() {
        const t = this.trials[this.stage];
        this.stageEl.textContent = `${this.stage + 1} / 3`;
        this.morseEl.textContent = t.morse;
        this.qTextEl.textContent = t.q;
        this.optsGrid.innerHTML = '';
        this.timeLeft = 15;
        this.playMorseSound();

        t.opts.forEach((o) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = o.text.replace(' [DOĞRU]', '');
          btn.addEventListener('click', () => {
            if (!this.active) return;
            if (o.correct) {
              this.audio.playTone(880, 0.2, 'triangle', 0.1);
              this.stage++;
              if (this.stage >= this.trials.length) {
                this.endGame(true, 'SORGU TAMAMLANDI! SENTIENT bilincinizi serbest bıraktı.');
              } else {
                this.renderQuestion();
              }
            } else {
              this.triggerMeltdown('YANLIŞ CEVAP! BİLİNÇ SİLİNİYOR');
            }
          });
          this.optsGrid.appendChild(btn);
        });
      }

      triggerMeltdown(msg) {
        this.active = false;
        clearInterval(this.timer);
        this.horror.triggerJumpscare(msg);
        setTimeout(() => {
          this.horror.triggerFakeBSOD(() => {
            if (window.sentientAPI && window.sentientAPI.sendEvent) {
              window.sentientAPI.sendEvent('minigame-result', {
                success: false,
                score: 0,
                message: msg || 'Sorgu başarısız.',
              });
            } else {
              window.location.href = '../hub.html';
            }
          });
        }, 600);
      }

      endGame(success, msg) {
        this.active = false;
        clearInterval(this.timer);
        if (success) {
          this.audio.playVictory();
          setTimeout(() => {
            if (window.sentientAPI && window.sentientAPI.sendEvent) {
              window.sentientAPI.sendEvent('minigame-result', {
                success: true,
                score: 100,
                message: msg || '',
                game: 'games/game10_trial.html',
              });
            } else {
              window.location.href = '../hub.html';
            }
          }, 800);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new TrialGame();
    });
  </script>
</body>
</html>
