<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#01 MEMORY SECTOR MATRIX</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../common/horror.css">
  <style>
    .game-arena {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 60px);
      margin-top: 60px;
    }
    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(4, 85px);
      gap: 14px;
      background: rgba(10, 16, 25, 0.9);
      padding: 24px;
      border: 2px solid #00ffff;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
    }
    .node-tile {
      width: 85px;
      height: 85px;
      background: #0d1a29;
      border: 2px solid #1a3a5a;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: #00ffff;
      transition: all 0.12s ease;
    }
    .node-tile:hover {
      border-color: #00ffff;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    }
    .node-tile.active {
      background: #00ffff;
      color: #000000;
      box-shadow: 0 0 25px #00ffff;
    }
    .node-tile.corrupted {
      background: #ff0055 !important;
      color: #ffffff !important;
      box-shadow: 0 0 30px #ff0055 !important;
    }
    .round-tracker {
      font-size: 20px;
      color: #00ffcc;
      margin-bottom: 18px;
      font-family: 'Share Tech Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="crt-scanlines"></div>
  <div class="crt-vignette"></div>

  <!-- HUD -->
  <div class="game-hud">
    <div class="hud-group">
      <span class="hud-tag">MİNİ OYUN:</span>
      <span class="hud-val normal">#01 MEMORY SECTOR MATRIX</span>
    </div>
    <div class="hud-group hud-right">
      <span class="hud-tag">SÜRE:</span>
      <div class="hud-timer"><span id="timer-val">40s</span></div>
    </div>
  </div>

  <div class="game-arena">
    <div class="round-tracker" id="round-status">AŞAMA 1/3: SİNYALİ İZLE</div>
    <div class="matrix-grid" id="matrix-grid"></div>
  </div>

  <script src="../audio/synth.js"></script>
  <script src="../common/horror_fx.js"></script>
  <script>
    class MemoryGame {
      constructor() {
        this.grid = document.getElementById('matrix-grid');
        this.statusEl = document.getElementById('round-status');
        this.timerEl = document.getElementById('timer-val');

        this.audio = new MinigameAudio();
        this.horror = new HorrorFX(this.audio);

        this.round = 1;
        this.maxRounds = 3;
        this.sequence = [];
        this.playerIdx = 0;
        this.isShowing = false;
        this.timeLeft = 40;
        this.active = false;

        this.init();
      }

      init() {
        this.createTiles();
        this.horror.showStartScreen(
          '#01 MEMORY MATRIX',
          'Yapay zekanın hafıza sektörlerindeki bozuk blokları sırayla eşle. 3 aşamayı tamamla.',
          () => {
            this.active = true;
            this.startClock();
            this.startRound();
          }
        );
      }

      createTiles() {
        this.grid.innerHTML = '';
        this.tiles = [];
        for (let i = 0; i < 16; i++) {
          const tile = document.createElement('div');
          tile.className = 'node-tile';
          tile.textContent = `0x${i.toString(16).toUpperCase()}`;
          tile.dataset.id = i;
          tile.addEventListener('click', () => this.handleTileClick(i));
          this.grid.appendChild(tile);
          this.tiles.push(tile);
        }
      }

      startClock() {
        this.timer = setInterval(() => {
          if (!this.active) return;
          this.timeLeft--;
          this.timerEl.textContent = `${this.timeLeft}s`;
          if (this.timeLeft <= 0) {
            this.endGame(false, 'ZAMAN TÜKENDİ! Bellek kilitlendi.');
          }
        }, 1000);
      }

      startRound() {
        this.playerIdx = 0;
        this.isShowing = true;
        this.statusEl.textContent = `AŞAMA ${this.round}/3: SİNYAL DİZİSİNİ İZLE`;
        this.statusEl.style.color = '#00ffff';

        const len = this.round + 3; // 4, 5, 6
        this.sequence = [];
        for (let i = 0; i < len; i++) {
          this.sequence.push(Math.floor(Math.random() * 16));
        }

        // Play sequence
        let i = 0;
        const seqInterval = setInterval(() => {
          if (!this.active) { clearInterval(seqInterval); return; }
          const tileId = this.sequence[i];
          this.flashTile(tileId, this.round === 3 ? 'corrupted' : 'active', 350);
          this.audio.playTone(300 + tileId * 40, 0.2, 'sine', 0.1);

          i++;
          if (i >= this.sequence.length) {
            clearInterval(seqInterval);
            setTimeout(() => {
              this.isShowing = false;
              this.statusEl.textContent = `AŞAMA ${this.round}/3: DİZİYİ TEKRARLA!`;
              this.statusEl.style.color = '#00ff88';

              if (this.round === 3) {
                // Whispers & Creepy tone
                this.audio.playTone(110, 1.5, 'sawtooth', 0.08);
              }
            }, 500);
          }
        }, 600);
      }

      flashTile(id, cls, duration = 300) {
        const t = this.tiles[id];
        if (!t) return;
        t.classList.add(cls);
        setTimeout(() => t.classList.remove(cls), duration);
      }

      handleTileClick(id) {
        if (!this.active || this.isShowing) return;

        this.flashTile(id, this.round === 3 ? 'corrupted' : 'active', 200);
        this.audio.playTone(350 + id * 35, 0.15, 'triangle', 0.1);

        if (id === this.sequence[this.playerIdx]) {
          this.playerIdx++;
          if (this.playerIdx >= this.sequence.length) {
            if (this.round >= this.maxRounds) {
              this.endGame(true, 'TEBRİKLER! Bellek sektörleri temizlendi.');
            } else {
              this.round++;
              setTimeout(() => this.startRound(), 800);
            }
          }
        } else {
          // Mistake!
          this.audio.playPlayerHurt();
          if (this.round === 3) {
            this.horror.triggerJumpscare('BELLEK ÇÖKTÜ');
          }
          this.statusEl.textContent = 'HATALI SEKTÖR! YENİDEN DENE';
          this.statusEl.style.color = '#ff0055';
          setTimeout(() => this.startRound(), 1000);
        }
      }

      endGame(success, msg) {
        this.active = false;
        clearInterval(this.timer);
        const onFinish = () => {
          if (window.sentientAPI && window.sentientAPI.sendEvent) {
            window.sentientAPI.sendEvent('minigame-result', {
              success: Boolean(success),
              score: this.score || (success ? 100 : 0),
              message: msg || '',
              game: 'games/game1_memory.html',
            });
          } else {
            window.location.href = '../hub.html';
          }
        };

        if (success) {
          this.audio.playVictory();
          setTimeout(onFinish, 800);
        } else {
          this.horror.triggerFakeBSOD(() => {
            onFinish();
          });
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new MemoryGame();
    });
  </script>
</body>
</html>
