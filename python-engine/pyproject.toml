[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentient-os-engine"
version = "2.0.0"
description = "SENTIENT_OS v2 Python Headless Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Muhammet Ali Büyük" }
]
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.19.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "edge-tts>=6.1.0",
    "google-generativeai>=0.8.0",
    "pywin32>=306; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
sentient = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
